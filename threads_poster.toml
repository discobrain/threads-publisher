# threads-poster configuration.
# Secrets (Threads app id/secret, redirect uri, Discourse creds) are NOT here --
# they come from the environment. Everything below is structure.

token_path = ".threads-token.json"   # where the long-lived token is persisted
limit = 500                          # per-post character limit (Threads)
poll_interval = 60                   # seconds between Discourse polls (publisher loop)

network_key = "threads"              # base of the -draft / -published tags
draft_label = "Threads"              # [details="<label>"] the drafter wraps posts in
# category = 5                       # only publish drafts in this Discourse category

crossreshare_to_ig = true            # also reshare the root post to Instagram Stories
# This account's light-mode crossreshare_to_ig returns "feature not available"
# (4279044) while the dark-mode variant works, so use dark mode.
crossreshare_dark_mode = true        # use the dark-mode IG Story variant
