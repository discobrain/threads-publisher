# threads-poster configuration.
# Secrets (Threads app id/secret, redirect uri, Discourse creds) are NOT here --
# they come from the environment. Everything below is structure.

token_path = ".threads-token.json"   # where the long-lived token is persisted
limit = 500                          # per-post character limit (Threads)
poll_interval = 60                   # seconds between Discourse polls (publisher loop)
min_publish_interval = 3600          # seconds; publish at most one post per this window
state_path = ".threads-state.json"   # remembers the last publish time (for the throttle)

network_key = "threads"              # base of the -draft / -published tags
draft_label = "Threads"              # [details="<label>"] the drafter wraps posts in
# category = 5                       # only publish drafts in this Discourse category

# IG Story cross-reshare is OFF. The API flag crossreshare_to_ig returns
# "feature not available" (4279044) for this app -- it needs App Review for
# threads_share_to_instagram, which we're not pursuing. Manual sharing from the
# Threads app still works. Flip to true if that API access is ever granted.
crossreshare_to_ig = false           # also reshare the root post to Instagram Stories
crossreshare_dark_mode = false       # dark-mode IG Story variant (only if enabled)

# Default Threads topic tag (community). A `Topic: <tag>` line in a draft (outside
# the ```md post text) overrides this per note; empty = no topic tag.
topic_tag = ""

link_back = true                     # comment the published Threads post URL back in Discourse
# Link each published note to this Discourse page so its backlinks list everything
# published (leave empty to just drop the Threads URL). Path or full URL.
published_index_url = "/t/threads-published/97"
