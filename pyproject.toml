[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "threads-poster"
version = "0.1.0"
description = "Publish approved Discourse drafts to Threads"
requires-python = ">=3.11"
dependencies = []              # stdlib only

[project.scripts]
threads-poster = "threads_poster.__main__:main"
get-token = "threads_poster.get_token:main"

[tool.setuptools]
packages = ["threads_poster"]
